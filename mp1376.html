<style>
/* Layout: painel de uma coluna, feito para caber num iframe do site; resumo (cartões) antes do detalhe (gráfico e tabela). */
:root {
  --bg: #ffffff;
  --surface: #f6f7f5;
  --ink: #1d2422;
  --ink-2: #4f5a57;
  --ink-3: #6f7a77;
  --rule: #e2e6e3;
  --grid: #eceeed;
  --brand: #0f7367;
  --brand-ink: #ffffff;
  --brand-soft: #e3f0ee;
  --logo-amarelo: #f5b417;
  /* séries: s1/s2 = cores do logo ajustadas para linha; s3/s4 = referências externas (tracejadas) */
  --s1: #008a76;
  --s2: #d99a00;
  --s3: #2a78d6;
  --s4: #8e44ad;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0d0d; --surface: #161a19; --ink: #f1f3f2; --ink-2: #c3cac7; --ink-3: #97a19e;
  --rule: #2a302e; --grid: #1f2423; --brand: #3fb3a3; --brand-ink: #0b0d0d; --brand-soft: #18302c;
  --s1: #0f9a84; --s2: #c98500; --s3: #3987e5; --s4: #a957b5; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 28px; display: grid; gap: 18px; }

header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; padding-bottom: 14px; border-bottom: 3px solid var(--logo-amarelo); }
.head-txt { min-width: 0; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
h1 { margin: 0; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.2; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
.logo { height: 46px; width: auto; flex: none; }
.logo-wrap { background: #ffffff; border-radius: 8px; padding: 4px 8px; display: flex; }
.head-dir { display: flex; align-items: center; gap: 12px; }
.tema { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tema:hover { border-color: var(--brand); color: var(--brand); }
.tema svg { width: 20px; height: 20px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tile-top { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.key { width: 16px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
.key.dash { border-top-style: dashed; }
.tile-val { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.tile-note { color: var(--ink-3); font-size: 12.5px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--ink-2); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--brand-soft); color: var(--ink); }
button:focus-visible, .plot:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ctl-label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }

.card { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 10px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-title { font-weight: 700; font-size: 16px; margin: 0; }
.card-unit { color: var(--ink-3); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.legend button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.legend button[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
.legend button[aria-pressed="false"] .key { opacity: .3; }

.plot { position: relative; outline: none; touch-action: pan-y; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.end-lab { font-size: 12px; fill: var(--ink); font-weight: 700; }
.end-sub { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; display: grid; gap: 3px; z-index: 2; }
.tip-date { color: var(--ink-2); font-size: 12px; margin-bottom: 2px; }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
.tip-row span { color: var(--ink-2); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding-top: 4px; border-top: 1px solid var(--rule); }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--brand); }
.btn-pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
.btn-pri:hover { filter: brightness(1.08); }
.btn svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; }
.baixar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 5; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 6px; min-width: 250px; display: grid; gap: 2px; }
.menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--ink-3); }
.menu button { font: inherit; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: 7px; cursor: pointer; display: grid; gap: 1px; }
.menu button:hover, .menu button:focus-visible { background: var(--brand-soft); }
.menu button b { font-size: 13.5px; }
.menu button span { font-size: 12px; color: var(--ink-3); }
.table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-weight: 700; color: var(--ink-2); }
footer { color: var(--ink-3); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; }
footer strong { color: var(--ink-2); font-weight: 700; }
footer .credito { flex-basis: 100%; }
footer a { color: var(--brand); }
.trava { position: fixed; inset: 0; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 24px; z-index: 10; }
.trava p { margin: 0; font-size: 16px; }
.trava .btn { text-decoration: none; padding: 10px 18px; }
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px; }
  .tile-val { font-size: 22px; }
  .logo { height: 38px; }
}
@media (prefers-reduced-motion: no-preference) { .plot path.line { transition: opacity .15s; } }

:root[data-theme="dark"] { --q1: #173a35; --q2: #1e5c53; --q3: #258172; --q4: #3caa95; --q5: #8bd8c6; --outras: #5d6764; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.sel.ativo { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.sel:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.limpar { font: inherit; font-size: 13px; color: var(--brand); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.recorte { font-size: 13px; color: var(--ink-2); }
header .head-txt { flex: 1 1 380px; }
.tile.destaque { box-shadow: inset 0 3px 0 var(--logo-amarelo); }
.tile-bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 4px; }
.tile-bar > i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.legend .chip { font-size: 13px; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); padding: 5px 4px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.nota { color: var(--ink-3); font-size: 12.5px; margin: 0; }
.plot .hl { stroke: var(--ink); stroke-width: 1.5; }
.bar-lab { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.cat-lab { font-size: 12.5px; fill: var(--ink); }
.cel { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.cel-h { font-size: 11px; fill: var(--ink-2); }
td.num-tot, th.num-tot { font-weight: 700; }
.cel { fill: var(--ink); }
.cel.forte { fill: #ffffff; }
:root[data-theme="dark"] .cel.forte { fill: #0b0d0d; }
</style>

  }
  // Tema sol/lua (igual ao indice.html): claro é o padrão; a escolha vale para todos os painéis.
  const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function aplicarTema(t, guardar) {

  document.getElementById("btn-tema").addEventListener("click", () => {

  // ---------- utilitários
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MESES_L = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const nf0 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rs = v => { if (v == null || isNaN(v)) return "–"; const a = Math.abs(v), s = v < 0 ? "-" : "";
    if (a >= 1e9) return s + "R$ " + nf2.format(a / 1e9) + " bi";
    if (a >= 1e6) return s + "R$ " + nf1.format(a / 1e6) + " mi";
    if (a >= 1e3) return s + "R$ " + nf0.format(a / 1e3) + " mil";

  const rsCurto = v => rs(v).replace("R$ ", "");

  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const dataBR = d => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();

  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } for (const c of [].concat(kids)) if (c) e.append(c); return e; };
  const SVG = "http://www.w3.org/2000/svg";
  const sv = (tag, attrs = {}, txt) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };
  const sum = (arr, k) => arr.reduce((t, r) => t + r[k], 0);

  const dias = D.dias.map(pd), dataBase = pd(D.dataBase), prazo = pd(D.prazo), dataMP = pd(D.dataMP);
  const iBase = D.dias.indexOf(D.dataBase);
  const PN = p => D.progNome[p] || p, FN = f => D.fonteNome[f] || f, FIN = f => D.finNome[f] || f;
  // ops: [dia, uf, grupo, prog, n, valor, reneg, nAntigas, juros*valor, prazo*valor]
  // divs: [uf, grupo, progAtual, progAnterior, fonteAtual, fonteAnterior, finalidade, valor]
  const O = { dia: 0, uf: 1, g: 2, p: 3, n: 4, v: 5, rn: 6, na: 7, jv: 8, pv: 9 };
  const Q = { uf: 0, g: 1, pa: 2, pn: 3, fa: 4, fn: 5, fin: 6, v: 7 };

  // ---------- estado
  const VISOES = [
    { id: "contratacao", nome: "Contratação" },
    { id: "instituicoes", nome: "Instituições" },
    { id: "estados", nome: "Estados" },
    { id: "origem", nome: "Origem da dívida" }

  const DETALHES = {
    contratacao: [{ id: "mensal", nome: "Por mês" }, { id: "acumulado", nome: "Acumulado" }],
    instituicoes: null,
    estados: [{ id: "total", nome: "Total" }, { id: "if", nome: "Por instituição" }, { id: "prog", nome: "Por programa" }, { id: "fonte", nome: "Por fonte" }],

  };
  const METRICAS = [{ id: "valor", nome: "Valor (R$)" }, { id: "qtd", nome: "Operações" }];
  const st = { visao: "contratacao", det: { contratacao: "mensal", estados: "total", origem: "finalidade" }, metrica: "valor", uf: -1, g: -1, p: -1 };
  try { const g = JSON.parse(localStorage.getItem("bd-" + D.id) || "{}"); if (VISOES.some(v => v.id === g.visao)) st.visao = g.visao; if (g.metrica) st.metrica = g.metrica; if (g.det) Object.assign(st.det, g.det); } catch (e) {}
  const salvar = () => { try { localStorage.setItem("bd-" + D.id, JSON.stringify({ visao: st.visao, metrica: st.metrica, det: st.det })); } catch (e) {} };
  const temMetrica = () => st.visao === "contratacao" || st.visao === "instituicoes" || (st.visao === "estados" && st.det.estados === "total");

  // ---------- filtros
  const fUf = $("f-uf"), fG = $("f-grupo"), fP = $("f-prog");
  const opt = (s, v, t) => s.append(el("option", { value: v, text: t }));
  opt(fUf, -1, "Todos os estados");
  D.ufs.map((u, i) => [u, i]).sort((a, b) => D.ufNome[a[0]].localeCompare(D.ufNome[b[0]], "pt-BR")).forEach(([u, i]) => opt(fUf, i, D.ufNome[u]));
  opt(fG, -1, "Todas as instituições"); D.grupos.forEach((g, i) => opt(fG, i, g));
  opt(fP, -1, "Todos os programas"); ["PRONAF", "PRONAMP", "DEMAIS"].forEach(p => { const i = D.progs.indexOf(p); if (i >= 0) opt(fP, i, PN(p)); });
  const aoFiltrar = () => { st.uf = +fUf.value; st.g = +fG.value; st.p = +fP.value; desenharTudo(); };
  [fUf, fG, fP].forEach(s => s.addEventListener("change", aoFiltrar));
  $("f-limpar").addEventListener("click", () => { fUf.value = fG.value = fP.value = "-1"; aoFiltrar(); });
  const passa = (uf, g, p, ignora) => (ignora === "uf" || st.uf < 0 || uf === st.uf) && (ignora === "g" || st.g < 0 || g === st.g) && (st.p < 0 || p === st.p);
  const opsF = ignora => D.ops.filter(r => passa(r[O.uf], r[O.g], r[O.p], ignora));
  const divsF = ignora => D.divs.filter(r => passa(r[Q.uf], r[Q.g], r[Q.pa], ignora));
  function recorte() {
    const p = [];
    if (st.uf >= 0) p.push(D.ufNome[D.ufs[st.uf]]);
    if (st.g >= 0) p.push(D.grupos[st.g]);
    if (st.p >= 0) p.push(PN(D.progs[st.p]));
    return p.length ? p.join(" · ") : "Brasil";
  }

  // ---------- cabeçalho, rodapé
  document.title = D.titulo;
  $("titulo").textContent = D.titulo;

  $("fontes").textContent = D.fontes;

  $("atualizado").textContent = D.atualizado.split("-").reverse().join("/");

  // ---------- cartões
  function desenharCartoes() {
    const o = opsF(), V = sum(o, O.v), N = sum(o, O.n), NA = sum(o, O.na), RN = sum(o, O.rn);
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const resta = Math.round((prazo - hoje) / 864e5), total = Math.round((prazo - dataMP) / 864e5);
    const encerrado = resta < 0;

      el("div", { class: "tile-top" }, [el("span", { text: titulo })]), el("div", { class: "tile-val", text: valor }), el("div", { class: "tile-note", text: nota }), extra]);
    const barra = el("div", { class: "tile-bar", "aria-hidden": "true" }, [el("i", { style: `width:${Math.min(100, Math.max(0, 100 * (total - Math.max(resta, 0)) / total)).toFixed(1)}%` })]);

  // ---------- controles
  function montarSeg(box, itens, atual, aoClicar) {

  }
  function desenharControles() {
    montarSeg($("seg-visao"), VISOES, st.visao, id => st.visao = id);
    const det = DETALHES[st.visao];
    $("ctl-detalhe").hidden = !det;

  // ---------- dados de cada visão: título, unidade, legenda, gráfico (construtor), tabela (cabeçalho + linhas + formatos)
  const COR = ["s1", "s2", "s3", "s4"];
  const corVar = c => c === "outras" ? "var(--outras)" : `var(--${c})`;
  function topComOutras(mapa, n) {   // até n categorias + "Outras" (nunca mais de 4 cores por gráfico)
    const l = Object.entries(mapa).sort((a, b) => b[1] - a[1]);
    const top = l.slice(0, n).map(x => x[0]);
    return l.length > n ? [...top, "Outras"] : top;
  }
  function visaoAtual() {
    const v = st.visao, qtd = st.metrica === "qtd" && temMetrica();
    const fmtV = qtd ? int : rs, fmtEixo = qtd ? int : rsCurto, unidQ = qtd ? "número de operações" : "R$";
    if (v === "contratacao" && st.det.contratacao === "mensal") {
      const o = opsF(), meses = [];
      for (let d = new Date(dataMP.getFullYear(), dataMP.getMonth(), 1); d <= prazo; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) meses.push(d);
      const dentro = (r, m) => { const d = dias[r[O.dia]]; return d.getFullYear() === m.getFullYear() && d.getMonth() === m.getMonth(); };
      const futuro = m => m > dataBase;

      const s2 = meses.map(m => futuro(m) ? null : o.filter(r => dentro(r, m)).reduce((t, r) => t + (qtd ? r[O.na] : r[O.rn]), 0));
      const series = [{ nome: qtd ? "Operações novas" : "Valor contratado", cor: "s1", vals: s1 }, { nome: qtd ? "Operações antigas" : "Dívida renegociada", cor: "s2", vals: s2 }];

        nota: "Meses depois da data dos dados ficam em branco: o Banco Central publica o SICOR uma vez por mês.",
        construir: W => barrasV(W, cats, series, fmtEixo, fmtV),

          linhas: meses.map((m, i) => [MESES_L[m.getMonth()] + "/" + m.getFullYear(), s1[i], s2[i]]).filter(l => l[1] != null) } };
    }
    if (v === "contratacao") {
      const o = opsF(), d1 = new Array(dias.length).fill(0);
      o.forEach(r => d1[r[O.dia]] += qtd ? r[O.n] : r[O.v]);
      let ac = 0; const cum = d1.map((x, i) => { ac += x; return i <= iBase ? ac : null; });
      const serie = { nome: qtd ? "Operações novas acumuladas" : "Valor contratado acumulado", cor: "s1", vals: cum };
      return { titulo: qtd ? "Operações novas acumuladas" : "Valor contratado acumulado", unid: unidQ + " · desde " + dataBR(dataMP), legenda: [serie],
        nota: "A linha termina na data dos dados do SICOR; a marca à direita é o fim do prazo de contratação.",

    }
    if (v === "instituicoes") {
      const o = opsF("g"), m = {};
      o.forEach(r => { const g = D.grupos[r[O.g]]; m[g] = (m[g] || 0) + (qtd ? r[O.n] : r[O.v]); });
      const l = Object.entries(m).sort((a, b) => b[1] - a[1]), T = l.reduce((t, x) => t + x[1], 0);
      const realce = st.g >= 0 ? D.grupos[st.g] : null;
      return { titulo: "Por instituição financeira", unid: unidQ + " · cooperativas somadas ao seu sistema", legenda: null,
        nota: "Cooperativas singulares aparecem somadas ao seu sistema (Sicredi, Cresol, Sicoob). O filtro de instituição destaca a barra, sem esconder as outras.",
        construir: W => barrasH(W, l.map(x => x[0]), l.map(x => x[1]), T, fmtV, realce),
        tabela: { cab: ["Instituição", qtd ? "Operações novas" : "Valor contratado (R$)", "Participação"], fmts: ["txt", qtd ? "int" : "rs", "pct"],

    if (v === "estados") {

      const porUF = {}; o.forEach(r => porUF[r[O.uf]] = (porUF[r[O.uf]] || 0) + (det === "total" && qtd ? r[O.n] : r[O.v]));
      const ufsTop = Object.entries(porUF).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => +x[0]);
      const T = Object.values(porUF).reduce((t, x) => t + x, 0);

        return { titulo: "Por estado", unid: unidQ + " · os 12 maiores", legenda: null,

            linhas: Object.entries(porUF).sort((a, b) => b[1] - a[1]).map(([u, x]) => [D.ufNome[D.ufs[u]], x, x / T]) } };
      }
      // composição por instituição, programa ou fonte (até 3 categorias + Outras)
      let chaveDe, rotulo, base;
      if (det === "if") { base = o; chaveDe = r => D.grupos[r[O.g]]; rotulo = c => c; }
      else if (det === "prog") { base = o; chaveDe = r => D.progs[r[O.p]]; rotulo = PN; }
      else { base = divsF("uf"); chaveDe = r => D.fontesRec[r[Q.fa]]; rotulo = c => c === "Outras" ? "Outras" : c + " – " + FN(c); }
      const valDe = r => det === "fonte" ? r[Q.v] : r[O.v], ufDe = r => det === "fonte" ? r[Q.uf] : r[O.uf];
      const tot = {}; base.forEach(r => { const c = chaveDe(r); tot[c] = (tot[c] || 0) + valDe(r); });
      const cats = det === "prog" ? ["PRONAMP", "DEMAIS", "PRONAF"].filter(c => tot[c]) : topComOutras(tot, 3);
      const de = r => { const c = chaveDe(r); return cats.includes(c) ? c : "Outras"; };
      const series = cats.map((c, k) => ({ nome: rotulo(c), cor: c === "Outras" ? "outras" : COR[k],
        vals: ufsTop.map(u => base.filter(r => ufDe(r) === u && de(r) === c).reduce((t, r) => t + valDe(r), 0)) }));
      const nomeDet = { if: "instituição", prog: "programa", fonte: "fonte de recursos" }[det];
      return { titulo: "Por estado e " + nomeDet, unid: "R$ · os 12 maiores estados", legenda: series,
        nota: det === "fonte" ? "Fonte de recursos da operação nova. RO = recursos obrigatórios; RL = livres; POUP = poupança rural; LCA = letra de crédito do agronegócio; EQ = equalizada." : det === "if" ? "As três maiores instituições no recorte; as demais somadas em \"Outras\"." : "Programa em que a operação nova foi enquadrada.",
        construir: W => empilhadasH(W, nomes, series, rs),
        tabela: { cab: ["Estado", ...series.map(s => s.nome + " (R$)"), "Total (R$)"], fmts: ["txt", ...series.map(() => "rs"), "rs"],
          linhas: ufsTop.map((u, i) => [nomes[i], ...series.map(s => s.vals[i]), series.reduce((t, s) => t + s.vals[i], 0)]) } };
    }
    // origem da dívida
    const det = st.det.origem, q = divsF(), T = sum(q, Q.v);
    if (det === "finalidade") {
      const m = {}; q.forEach(r => { const f = D.fins[r[Q.fin]]; m[f] = (m[f] || 0) + r[Q.v]; });
      const l = Object.entries(m).sort((a, b) => b[1] - a[1]);
      return { titulo: "Finalidade da dívida renegociada", unid: "R$ · valor contratado distribuído pelas dívidas antigas", legenda: null,
        nota: "Cada operação nova quita uma ou mais dívidas antigas; o valor é distribuído entre elas na proporção do saldo renegociado.",
        construir: W => barrasH(W, l.map(x => FIN(x[0])), l.map(x => x[1]), T, rs, null),
        tabela: { cab: ["Finalidade da dívida antiga", "Valor (R$)", "Participação"], fmts: ["txt", "rs", "pct"], linhas: l.map(x => [FIN(x[0]), x[1], x[1] / T]) } };
    }
    if (det === "programa") {
      const ordem = ["PRONAF", "PRONAMP", "DEMAIS"], linhas = ordem.filter(pn => q.some(r => D.progs[r[Q.pn]] === pn));
      const atuais = ["PRONAMP", "DEMAIS", "PRONAF"].filter(pa => q.some(r => D.progs[r[Q.pa]] === pa));
      const val = (pn, pa) => q.filter(r => D.progs[r[Q.pn]] === pn && D.progs[r[Q.pa]] === pa).reduce((t, r) => t + r[Q.v], 0);
      const series = atuais.map((pa, k) => ({ nome: "Nova em " + PN(pa), cor: COR[k], vals: linhas.map(pn => val(pn, pa)) }));
      return { titulo: "Programa: antes e depois da renegociação", unid: "R$ · barra = programa da dívida antiga; cor = programa da operação nova", legenda: series,
        nota: "Mostra quanto das dívidas de cada programa foi renegociado em cada programa. Ex.: dívidas de 'Demais produtores' que viraram operações do Pronamp.",
        construir: W => empilhadasH(W, linhas.map(pn => "Dívida " + PN(pn)), series, rs),
        tabela: { cab: ["Programa da dívida antiga", ...series.map(s => s.nome + " (R$)"), "Total (R$)"], fmts: ["txt", ...series.map(() => "rs"), "rs"],

  // ---------- gráficos em SVG (sem biblioteca)
  function passoBonito(bruto) { const e = Math.pow(10, Math.floor(Math.log10(bruto))), f = bruto / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
  function escala(hi) { if (!(hi > 0)) hi = 1; const passo = passoBonito(hi / 5); return { passo, hi: Math.ceil(hi * 1.06 / passo) * passo }; }
  const dica = (titulo, linhas) => [titulo, ...linhas].join("|");

  function barrasV(W, cats, series, fmtEixo, fmtV) {
    const estreito = W < 560, H = estreito ? 280 : 360, m = { l: estreito ? 56 : 70, r: 10, t: 22, b: 30 };

  function barrasH(W, cats, vals, T, fmtV, realce) {

        fill: "var(--s1)", "fill-opacity": apagado ? .3 : 1, class: realce && !apagado ? "hl" : "", "data-tip": dica(c, [fmtV(vals[i]) + " · " + pct(vals[i] / T)]) }));

  function empilhadasH(W, cats, series, fmtV) {
    const estreito = W < 560, lab = estreito ? 110 : 190, linha = 34, m = { t: 6, b: 26 };
    const H = m.t + m.b + cats.length * linha;

  function matriz(W, L, C, m, lin, col, T) {
    const estreito = W < 560, labW = estreito ? 74 : 110, cab = 34, linha = estreito ? 26 : 30;
    const cw = Math.max(estreito ? 40 : 52, (W - labW - (estreito ? 56 : 76)) / (C.length + 1));

    const vals = Object.values(m).filter(v => v > 0).sort((a, b) => a - b);
    const q = k => vals[Math.min(vals.length - 1, Math.floor(vals.length * k))];
    const cortes = [q(.2), q(.4), q(.6), q(.8)];
    const faixa = v => 1 + cortes.filter(c => v > c).length;
    const mi = v => v ? nf1.format(v / 1e6) : "·";

    svg.append(sv("text", { x: 0, y: 14, class: "cel-h" }, "nova ↓  antiga →"));

    const celula = (x, y, v, total, tip) => {
      const f = total ? 0 : v ? faixa(v) : 0;
      svg.append(sv("rect", { x: x + 1, y: y + 1, width: cw - 2, height: linha - 2, rx: 3, fill: total ? "var(--surface)" : f ? `var(--q${f})` : "var(--surface)", "fill-opacity": total || f ? 1 : .5, "data-tip": tip }));

    };

  }

  // ---------- downloads (mesmo padrão do indice.html)
  const nomeArquivo = (sufixo, ext) => `FARSUL Big Data - ${D.titulo}${sufixo ? " - " + sufixo : ""}.${ext}`.replace(/[\\/:*?"<>|]/g, "-");
  function baixar(blob, nome) { const url = URL.createObjectURL(blob), a = el("a", { href: url, download: nome }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
  const XLSX_TIPO = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

  // Excel montado no navegador (sem biblioteca): aba "Sobre" + aba com a tabela da visão
  function montarXlsx(sobre, nomeAba, t) {
    const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const col = k => (k >= 26 ? String.fromCharCode(64 + Math.floor(k / 26)) : "") + String.fromCharCode(65 + k % 26);
    const txt = (ref, s, b) => `<c r="${ref}" t="inlineStr"${b ? ` s="${b}"` : ""}><is><t xml:space="preserve">${esc(s)}</t></is></c>`;
    const serial = s => (Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) - Date.UTC(1899, 11, 30)) / 864e5;
    const estilo = { rs: 4, int: 5, pct: 3, data: 2 };
    const folha = (corpo, extra) => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${extra || ""}<sheetData>${corpo}</sheetData></worksheet>`;
    const f1 = folha(sobre.map((l, i) => `<row r="${i + 1}">${l[0] !== "" ? txt("A" + (i + 1), l[0], l[1] ? 1 : 0) : ""}</row>`).join(""), '<cols><col min="1" max="1" width="100" customWidth="1"/></cols>');
    let corpo = `<row r="1">${t.cab.map((h, k) => txt(col(k) + 1, h, 1)).join("")}</row>`;
    t.linhas.forEach((l, i) => {
      const r = i + 2;
      corpo += `<row r="${r}">` + l.map((v, k) => {
        const f = t.fmts[k], ref = col(k) + r;
        if (v == null || v === "") return "";

  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  function zipar(arquivos) {
    const enc = new TextEncoder(), partes = [], central = []; let pos = 0;
    for (const nome in arquivos) {
      const n = enc.encode(nome), d = enc.encode(arquivos[nome]), c = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
      partes.push(new Uint8Array(h.buffer), n, d);
      const e = new DataView(new ArrayBuffer(46));
      e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x0800, true);
      e.setUint32(16, c, true); e.setUint32(20, d.length, true); e.setUint32(24, d.length, true); e.setUint16(28, n.length, true); e.setUint32(42, pos, true);
      central.push(new Uint8Array(e.buffer), n);
      pos += 30 + n.length + d.length;
    }
    const tam = central.reduce((t, x) => t + x.length, 0), f = new DataView(new ArrayBuffer(22)), qtd = Object.keys(arquivos).length;
    f.setUint32(0, 0x06054b50, true); f.setUint16(8, qtd, true); f.setUint16(10, qtd, true); f.setUint32(12, tam, true); f.setUint32(16, pos, true);
    return new Blob([...partes, ...central, new Uint8Array(f.buffer)]);
  }
