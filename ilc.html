<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Índice do Custo do Leite (ILC)</title>
<style>
/* Layout: painel de uma coluna, feito para caber num iframe do site; resumo (cartões) antes do detalhe (gráfico e tabela). */
:root {
  --bg: #ffffff;
  --surface: #f6f7f5;
  --ink: #1d2422;
  --ink-2: #4f5a57;
  --ink-3: #6f7a77;
  --rule: #e2e6e3;
  --grid: #eceeed;
  --brand: #0f7367;
  --brand-ink: #ffffff;
  --brand-soft: #e3f0ee;
  --s1: #008300;
  --s2: #2a78d6;
  --s3: #eda100;
  --s4: #d55181;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a19; --surface: #1f2423; --ink: #f1f3f2; --ink-2: #c3cac7; --ink-3: #97a19e;
    --rule: #2f3634; --grid: #262c2b; --brand: #3fb3a3; --brand-ink: #0c1413; --brand-soft: #1d3431;
    --s1: #008300; --s2: #3987e5; --s3: #c98500; --s4: #d55181; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a19; --surface: #1f2423; --ink: #f1f3f2; --ink-2: #c3cac7; --ink-3: #97a19e;
  --rule: #2f3634; --grid: #262c2b; --brand: #3fb3a3; --brand-ink: #0c1413; --brand-soft: #1d3431;
  --s1: #008300; --s2: #3987e5; --s3: #c98500; --s4: #d55181; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 28px; display: grid; gap: 18px; }

header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
.head-txt { min-width: 0; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
h1 { margin: 0; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.2; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
.logo { height: 46px; width: auto; flex: none; }
.logo-wrap { background: #ffffff; border-radius: 8px; padding: 4px 8px; display: flex; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tile-top { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.key { width: 16px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
.key.dash { border-top-style: dashed; }
.tile-val { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.tile-note { color: var(--ink-3); font-size: 12.5px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--ink-2); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--brand-soft); color: var(--ink); }
button:focus-visible, .plot:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ctl-label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }

.card { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 10px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-title { font-weight: 700; font-size: 16px; margin: 0; }
.card-unit { color: var(--ink-3); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.legend button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.legend button[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
.legend button[aria-pressed="false"] .key { opacity: .3; }

.plot { position: relative; outline: none; touch-action: pan-y; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.end-lab { font-size: 12px; fill: var(--ink); font-weight: 700; }
.end-sub { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; display: grid; gap: 3px; z-index: 2; }
.tip-date { color: var(--ink-2); font-size: 12px; margin-bottom: 2px; }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
.tip-row span { color: var(--ink-2); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding-top: 4px; border-top: 1px solid var(--rule); }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--brand); }
.btn-pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
.btn-pri:hover { filter: brightness(1.08); }
.table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-weight: 700; color: var(--ink-2); }
footer { color: var(--ink-3); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; }
footer strong { color: var(--ink-2); font-weight: 700; }
footer .credito { flex-basis: 100%; }
footer a { color: var(--brand); }
.trava { position: fixed; inset: 0; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 24px; z-index: 10; }
.trava p { margin: 0; font-size: 16px; }
.trava .btn { text-decoration: none; padding: 10px 18px; }
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px; }
  .tile-val { font-size: 22px; }
  .logo { height: 38px; }
}
@media (prefers-reduced-motion: no-preference) { .plot path.line { transition: opacity .15s; } }
</style>
</head>

(function () {
  // Trava: a cópia publicada (github.io) só funciona dentro do site da FARSUL.
  // Arquivo aberto no computador e prévias continuam funcionando normalmente.
  const SITES_OK = /(^|\.)farsul\.org\.br$/i;
  if (/\.github\.io$/i.test(location.hostname)) {
    let origem = "";
    try { if (location.ancestorOrigins && location.ancestorOrigins.length) origem = location.ancestorOrigins[location.ancestorOrigins.length - 1]; } catch (e) {}
    if (!origem && window.top !== window.self) origem = document.referrer || "";
    let host = ""; try { host = origem ? new URL(origem).hostname : ""; } catch (e) {}
    const foraDeIframe = window.top === window.self;
    const bloqueia = foraDeIframe || (host && !SITES_OK.test(host));
    if (bloqueia) { document.getElementById("trava").hidden = false; document.querySelector(".wrap").hidden = true; return; }
  }
  if (location.hash === "#claro") document.documentElement.setAttribute("data-theme", "light");
  if (location.hash === "#escuro") document.documentElement.setAttribute("data-theme", "dark");

  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MEDIDAS = [
    { id: "indice", nome: "Índice acumulado", curto: "Índice", pct: false },
    { id: "mes", nome: "Variação no mês", curto: "No mês", pct: true },
    { id: "ano", nome: "Acumulado no ano", curto: "No ano", pct: true },
    { id: "m12", nome: "Acumulado em 12 meses", curto: "Em 12 meses", pct: true }
  ].filter(m => D.medidas[m.id]);
  const PERIODOS = [
    { id: "12", nome: "12 meses", n: 12 }, { id: "36", nome: "3 anos", n: 36 },
    { id: "60", nome: "5 anos", n: 60 }, { id: "tudo", nome: "Tudo", n: Infinity }
  ];
  const nf1 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rotMes = s => MESES[+s.slice(5, 7) - 1] + "/" + s.slice(2, 4);
  const rotMesLongo = s => MESES[+s.slice(5, 7) - 1] + "/" + s.slice(0, 4);
  const fmt = (v, pct) => v == null || isNaN(v) ? "–" : pct ? nf2.format(v * 100) + "%" : nf1.format(v);
  const cor = s => `var(--${s.cor})`;
  const multi = D.series.length > 1;

  const st = { medida: D.padrao?.medida || "indice", periodo: D.padrao?.periodo || "tudo", ativas: new Set(D.series.map(s => s.id)) };
  try { const g = JSON.parse(localStorage.getItem("bd-" + D.id) || "{}"); if (g.medida && D.medidas[g.medida]) st.medida = g.medida; if (g.periodo) st.periodo = g.periodo; } catch (e) {}
  const salvar = () => { try { localStorage.setItem("bd-" + D.id, JSON.stringify({ medida: st.medida, periodo: st.periodo })); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } for (const c of [].concat(kids)) if (c) e.append(c); return e; };
  const SVG = "http://www.w3.org/2000/svg";
  const sv = (tag, attrs = {}) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const chave = s => el("span", { class: "key" + (s.tracejado ? " dash" : ""), style: `border-top-color:${cor(s)}` });

  // ---------- cabeçalho, rodapé
  document.title = D.titulo;
  $("titulo").textContent = D.titulo;
  $("subtitulo").textContent = D.subtitulo || "";
  $("fontes").textContent = D.fontes;
  const N = D.datas.length, ultimaData = D.datas[N - 1];
  $("ultimo").textContent = rotMesLongo(ultimaData);
  $("atualizado").textContent = D.atualizado.split("-").reverse().join("/");

  // ---------- controles
  function montarSeg(box, itens, chaveSt, rot) {
    box.replaceChildren(...itens.map(it => {
      const b = el("button", { type: "button", "aria-pressed": String(st[chaveSt] === it.id), text: rot(it) });
      b.addEventListener("click", () => { st[chaveSt] = it.id; salvar(); desenharTudo(); });
      return b;
    }));
  }

  // ---------- último valor válido de uma série
  function ultimoValido(arr) { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i; return -1; }

  function desenharCartoes() {
    const box = $("tiles"), med = MEDIDAS.find(m => m.id === st.medida);
    const cards = [];
    if (multi) {
      for (const s of D.series) {
        const arr = D.medidas[st.medida][s.id], i = ultimoValido(arr);
        const a12 = D.medidas.m12 ? D.medidas.m12[s.id][ultimoValido(D.medidas.m12[s.id])] : null;
        cards.push(el("div", { class: "tile" }, [
          el("div", { class: "tile-top" }, [chave(s), el("span", { text: s.nome })]),
          el("div", { class: "tile-val", text: fmt(arr[i], med.pct) }),
          el("div", { class: "tile-note", text: `${med.curto} · ${i >= 0 ? rotMes(D.datas[i]) : ""}` + (st.medida !== "m12" && a12 != null ? ` · 12 meses: ${fmt(a12, true)}` : "") })
        ]));
      }
    } else {
      const s = D.series[0];
      for (const m of MEDIDAS) {
        const arr = D.medidas[m.id][s.id], i = ultimoValido(arr);
        cards.push(el("div", { class: "tile" }, [
          el("div", { class: "tile-top" }, [el("span", { text: m.nome })]),
          el("div", { class: "tile-val", text: fmt(arr[i], m.pct) }),
          el("div", { class: "tile-note", text: `${s.nome} · ${i >= 0 ? rotMes(D.datas[i]) : ""}` + (m.id === "indice" && D.base ? ` · base ${D.base}` : "") })
        ]));
      }
    }
    box.replaceChildren(...cards);
  }

  function desenharLegenda() {
    const box = $("legenda");
    if (!multi) { box.hidden = true; return; }
    box.replaceChildren(...D.series.map(s => {
      const b = el("button", { type: "button", "aria-pressed": String(st.ativas.has(s.id)), title: s.descricao || s.nome }, [chave(s), el("span", { text: s.nome })]);
      b.addEventListener("click", () => {
        if (st.ativas.has(s.id)) { if (st.ativas.size > 1) st.ativas.delete(s.id); } else st.ativas.add(s.id);
        desenharTudo();
      });
      return b;
    }));
  }

  function intervalo() {
    const p = PERIODOS.find(p => p.id === st.periodo) || PERIODOS[3];
    // começa no primeiro mês em que alguma série ativa tem valor
    const arrs = D.series.filter(s => st.ativas.has(s.id)).map(s => D.medidas[st.medida][s.id]);
    let i0 = 0; while (i0 < N - 1 && arrs.every(a => a[i0] == null)) i0++;
    return [Math.max(i0, N - p.n), N - 1];
  }

  function passoBonito(bruto) {
    const e = Math.pow(10, Math.floor(Math.log10(bruto))), f = bruto / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }

  let estadoGraf = null;
  function desenharGrafico() {
    const box = $("plot"), med = MEDIDAS.find(m => m.id === st.medida);
    $("graf-titulo").textContent = med.nome;
    $("graf-unid").textContent = med.pct ? "% " + (med.id === "mes" ? "sobre o mês anterior" : med.id === "ano" ? "desde dezembro do ano anterior" : "nos últimos 12 meses") : (D.base ? "índice, base " + D.base : "índice");
    const W = Math.max(320, box.clientWidth || 800), estreito = W < 560;
    const H = estreito ? 260 : 360;
    const [a, b] = intervalo();
    const ser = D.series.filter(s => st.ativas.has(s.id));
    const m = { l: 52, r: 16, t: 14, b: 30 };
    let lo = Infinity, hi = -Infinity;
    for (const s of ser) for (let i = a; i <= b; i++) { const v = D.medidas[st.medida][s.id][i]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (med.pct) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    const passo = passoBonito((hi - lo) / 5);
    lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
    const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
    // rótulos no fim das linhas só quando cabem sem se amontoar; senão ficam a legenda e o tooltip
    const finsY = ser.map(s => { const arr = D.medidas[st.medida][s.id]; let iu = b; while (iu >= a && arr[iu] == null) iu--; return iu >= a ? Y(arr[iu]) : null; }).filter(v => v != null).sort((p, q) => p - q);
    const comRotulo = !estreito && finsY.length <= 4 && finsY.every((y, k) => k === 0 || y - finsY[k - 1] >= 28);
    if (comRotulo) m.r = 110;
    const X = i => m.l + (b === a ? 0 : (i - a) / (b - a) * (W - m.l - m.r));

    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${med.nome}, ${rotMes(D.datas[a])} a ${rotMes(D.datas[b])}` });
    // grade + eixo y
    const gy = sv("g");
    for (let v = lo; v <= hi + passo / 2; v += passo) {
      const y = Y(v), zero = Math.abs(v) < passo / 1000;
      gy.append(sv("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: zero && med.pct ? "var(--ink-3)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", class: "tick" });
      t.textContent = med.pct ? nf1.format(v * 100) + "%" : new Intl.NumberFormat("pt-BR").format(Math.round(v));
      gy.append(t);
    }
    svg.append(gy);
    // eixo x: marcas em janeiro (ou a cada n meses em períodos curtos)
    const nMeses = b - a + 1, gx = sv("g");
    const cada = nMeses <= 13 ? 1 : nMeses <= 40 ? 3 : 12;
    let ultimoX = -Infinity;
    for (let i = a; i <= b; i++) {
      const mm = +D.datas[i].slice(5, 7);
      const marca = cada === 12 ? mm === 1 : (mm - 1) % cada === 0;
      if (!marca) continue;
      const x = X(i); if (x - ultimoX < (estreito ? 44 : 38)) continue; ultimoX = x;
      const t = sv("text", { x, y: H - 10, "text-anchor": "middle", class: "tick" });
      t.textContent = cada === 12 ? D.datas[i].slice(0, 4) : rotMes(D.datas[i]);
      gx.append(t);
    }
    svg.append(gx);
    // linhas
    const fins = [];
    for (const s of ser) {
      const arr = D.medidas[st.medida][s.id]; let d = "", caneta = false;
      for (let i = a; i <= b; i++) {
        const v = arr[i];
        if (v == null) { caneta = false; continue; }
        d += (caneta ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); caneta = true;
      }
      const p = sv("path", { d, fill: "none", stroke: cor(s), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", class: "line" });
      if (s.tracejado) p.setAttribute("stroke-dasharray", "6 4");
      svg.append(p);
      let iu = b; while (iu >= a && arr[iu] == null) iu--;
      if (iu >= a) {
        svg.append(sv("circle", { cx: X(iu), cy: Y(arr[iu]), r: 4, fill: cor(s), stroke: "var(--bg)", "stroke-width": 2 }));
        fins.push({ s, y: Y(arr[iu]), v: arr[iu] });
      }
    }
    // rótulos no fim das linhas (só em telas largas); afastados sem perder a ligação com a linha
    if (comRotulo) {
      for (const f of fins) {
        const x0 = W - m.r + 12;
        const t1 = sv("text", { x: x0, y: f.y - 2, class: "end-lab" }); t1.textContent = f.s.nome;
        const t2 = sv("text", { x: x0, y: f.y + 12, class: "end-sub" }); t2.textContent = fmt(f.v, med.pct);
        svg.append(t1, t2);
      }
    }
    // camada de hover
    const cruz = sv("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" });
    const pontos = sv("g", { visibility: "hidden" });
    svg.append(cruz, pontos);
    const tip = el("div", { class: "tip", hidden: "" });
    box.replaceChildren(svg, tip);
    estadoGraf = { a, b, X, Y, W, H, m, med, ser, cruz, pontos, tip, svg, i: null };
  }

  function mostrarPonto(i) {
    const g = estadoGraf; if (!g) return;
    i = Math.max(g.a, Math.min(g.b, i)); g.i = i;
    const x = g.X(i);
    g.cruz.setAttribute("x1", x); g.cruz.setAttribute("x2", x); g.cruz.setAttribute("visibility", "visible");
    g.pontos.replaceChildren(); g.pontos.setAttribute("visibility", "visible");
    const linhas = [];
    for (const s of g.ser) {
      const v = D.medidas[st.medida][s.id][i];
      if (v != null) g.pontos.append(sv("circle", { cx: x, cy: g.Y(v), r: 4, fill: cor(s), stroke: "var(--bg)", "stroke-width": 2 }));
      linhas.push({ s, v });
    }
    linhas.sort((p, q) => (q.v ?? -Infinity) - (p.v ?? -Infinity));
    g.tip.replaceChildren(el("div", { class: "tip-date", text: rotMesLongo(D.datas[i]) }),
      ...linhas.map(l => el("div", { class: "tip-row" }, [chave(l.s), el("span", { text: l.s.nome }), el("b", { text: fmt(l.v, g.med.pct) })])));
    g.tip.hidden = false;
    const box = $("plot"), escala = box.clientWidth / g.W;
    const tw = g.tip.offsetWidth, px = x * escala;
    let left = px + 14; if (left + tw > box.clientWidth) left = px - tw - 14; if (left < 0) left = 0;
    g.tip.style.left = left + "px"; g.tip.style.top = (g.m.t * escala + 4) + "px";
  }
  function esconder() { const g = estadoGraf; if (!g) return; g.cruz.setAttribute("visibility", "hidden"); g.pontos.setAttribute("visibility", "hidden"); g.tip.hidden = true; }
  const plot = $("plot");
  plot.addEventListener("pointermove", ev => {
    const g = estadoGraf; if (!g) return;
    const r = plot.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * g.W;
    if (x < g.m.l - 10 || x > g.W - g.m.r + 10) { esconder(); return; }
    mostrarPonto(Math.round(g.a + (x - g.m.l) / (g.W - g.m.l - g.m.r) * (g.b - g.a)));
  });
  plot.addEventListener("pointerleave", esconder);
  plot.addEventListener("blur", esconder);
  plot.addEventListener("keydown", ev => {
    const g = estadoGraf; if (!g) return;
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); mostrarPonto((g.i ?? g.b) + (ev.key === "ArrowLeft" ? -1 : 1)); }
    if (ev.key === "Home") mostrarPonto(g.a); if (ev.key === "End") mostrarPonto(g.b); if (ev.key === "Escape") esconder();
  });

  // ---------- tabela e CSV
  function linhasTabela() {
    const [a, b] = intervalo(), med = MEDIDAS.find(m => m.id === st.medida), rows = [];
    for (let i = b; i >= a; i--) rows.push([rotMesLongo(D.datas[i]), ...D.series.map(s => fmt(D.medidas[st.medida][s.id][i], med.pct))]);
    return rows;
  }
  function desenharTabela() {
    const box = $("tabela"); if (box.hidden) return;
    const t = el("table"), th = el("thead"), tr = el("tr");
    tr.append(el("th", { text: "Mês" }), ...D.series.map(s => el("th", { text: s.nome })));
    th.append(tr); t.append(th);
    const tb = el("tbody");
    for (const r of linhasTabela()) tb.append(el("tr", {}, r.map(c => el("td", { text: c }))));
    t.append(tb); box.replaceChildren(t);
  }
  $("btn-tabela").addEventListener("click", () => {
    const box = $("tabela"); box.hidden = !box.hidden;
    $("btn-tabela").textContent = box.hidden ? "Ver tabela" : "Esconder tabela";
    $("btn-tabela").setAttribute("aria-expanded", String(!box.hidden));
    desenharTabela();
  });
  // planilha completa (todas as medidas e meses), montada pelo script Python junto com o painel
  $("btn-xlsx").addEventListener("click", () => {
    const bin = atob(XLSX_B64), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob), a = el("a", { href: url, download: "FARSUL Big Data - " + D.titulo + ".xlsx" });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  });

  function desenharTudo() {
    montarSeg($("seg-medida"), MEDIDAS, "medida", it => it.curto);
    montarSeg($("seg-periodo"), PERIODOS, "periodo", it => it.nome);
    desenharCartoes(); desenharLegenda(); desenharGrafico(); desenharTabela();
    avisarAltura();
  }

  // ---------- iframe: avisa a página do site sobre a altura, para ajustar sem barra de rolagem
  function avisarAltura() { try { parent.postMessage({ bigdata: D.id, altura: document.documentElement.scrollHeight }, "*"); } catch (e) {} }
  let rt, larg = plot.clientWidth;
  new ResizeObserver(() => { if (plot.clientWidth === larg) return; larg = plot.clientWidth; clearTimeout(rt); rt = setTimeout(() => { desenharGrafico(); avisarAltura(); }, 80); }).observe(plot);
  desenharTudo();
})();
</script>
