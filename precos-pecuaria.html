<style>
/* Identidade do Sistema FARSUL (MIV 2022): verde #00604E (3298 C), laranja #FDB92E (137 C), fonte Ubuntu; logo do FARSUL Big Data. */
/* Painel de uma coluna para iframe: abas por produto; em cada aba, cartões, evolução das praças e comparação no último mês. */
:root {
  --bg: #ffffff; --surface: #f4f6f5; --ink: #1c2422; --ink-2: #4a5654; --ink-3: #626e6b;
  --rule: #dfe5e3; --grid: #ecefee; --brand: #00604e; --brand-ink: #ffffff; --brand-soft: #e0eeea;
  --laranja: #fdb92e; --logo-amarelo: var(--laranja);
  /* séries (guia, paleta MIV validada): s1/s2 = verde e laranja FARSUL; s3/s4 = cores de apoio, tracejadas */
  --s1: #00604e; --s2: #e09600; --s3: #2a78d6; --s4: #8e44ad; --ref: #8a9491; --band: rgba(224, 150, 0, .13);
  --font: "Ubuntu", Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #231f20; --surface: #2e2a2b; --ink: #f3f2f2; --ink-2: #cbc7c7; --ink-3: #9e9899;
  --rule: #3b3637; --grid: #332e2f; --brand: #2fb596; --brand-ink: #231f20; --brand-soft: #173e36;
  --s1: #1f9a80; --s2: #c98500; --s3: #3987e5; --s4: #a957b5; --ref: #7d8784; --band: rgba(201, 133, 0, .2); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 28px; display: grid; gap: 18px; }

header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; padding-bottom: 14px; border-bottom: 3px solid var(--logo-amarelo); }
.head-dir { display: flex; align-items: center; gap: 12px; }
.tema { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tema:hover { border-color: var(--brand); color: var(--brand); }
.tema svg { width: 20px; height: 20px; }
.btn svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 5; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 6px; min-width: 260px; max-width: min(360px, 90vw); display: grid; gap: 2px; }
.menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--ink-3); }
.menu button { font: inherit; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: 7px; cursor: pointer; display: grid; gap: 1px; }
.menu button:hover, .menu button:focus-visible { background: var(--brand-soft); }
.menu button b { font-size: 13.5px; }
.menu button span { font-size: 12px; color: var(--ink-3); }
.head-txt { min-width: 0; display: grid; gap: 4px; flex: 1 1 420px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
h1 { margin: 0; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.2; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
.logo { height: 46px; width: auto; flex: none; }
.logo-wrap { background: #ffffff; border-radius: 8px; padding: 4px 8px; display: flex; }

/* abas */
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--rule); margin-inline: -4px; padding-inline: 4px; }
.tabs button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink-2); padding: 10px 12px 9px; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; border-bottom-color: var(--brand); }
.tabs button:hover:not([aria-selected="true"]) { color: var(--ink); background: var(--brand-soft); border-radius: 6px 6px 0 0; }
.painel { display: grid; gap: 18px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; text-align: left; font: inherit; color: inherit; border: 1px solid transparent; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--brand); }
button.tile[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.tile-top { color: var(--ink-2); font-size: 13px; }
.tile-val { font-size: 26px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tile-val small { font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 3px; }
.tile-note { color: var(--ink-3); font-size: 12.5px; }
.tile-alerta { color: var(--ink); font-size: 12.5px; font-weight: 700; }

.card { border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 10px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.card-title { font-weight: 700; font-size: 16px; margin: 0; padding-left: 10px; border-left: 4px solid var(--laranja); line-height: 1.25; }
.card-unit { color: var(--ink-3); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; }
.ctl-label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.seg { display: inline-flex; background: var(--surface); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2); padding: 6px 11px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 500; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--brand-soft); color: var(--ink); }
select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 30px 6px 10px; max-width: 100%; min-width: 0;
  appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.ctl-sel { flex: 1 1 260px; }
.ctl-sel select { flex: 1 1 auto; width: 100%; max-width: 420px; }
button:focus-visible, select:focus-visible, .plot:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend span.item { display: inline-flex; align-items: center; gap: 7px; }
.key { width: 16px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
.key.dash { border-top-style: dashed; }
.key.band { height: 10px; border: 0; background: var(--band); border-radius: 2px; }

.plot { position: relative; outline: none; touch-action: pan-y; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.end-lab { font-size: 12px; fill: var(--ink); font-weight: 700; }
.bar-lab { font-size: 12.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.bar-nome { font-size: 13px; fill: var(--ink); }
.bar-nota { font-size: 11.5px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; display: grid; gap: 3px; z-index: 2; }
.tip-date { color: var(--ink-2); font-size: 12px; margin-bottom: 2px; }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
.tip-row span { color: var(--ink-2); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid var(--rule); }
.fonte { color: var(--ink-3); font-size: 12px; flex: 1 1 300px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--brand); }
.btn-pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 500; }
.btn-pri:hover { filter: brightness(1.08); }
.table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-weight: 700; color: var(--ink-2); }
footer { color: var(--ink-3); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 12px; }
footer strong { color: var(--ink-2); font-weight: 700; }
footer .credito { flex-basis: 100%; }
footer a { color: var(--brand); }
.trava { position: fixed; inset: 0; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 24px; z-index: 10; }
.trava p { margin: 0; font-size: 16px; }
.trava .btn { text-decoration: none; padding: 10px 18px; }
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px; }
  .tile-val { font-size: 21px; }
  .logo { height: 38px; }
  .card { padding: 12px 12px 8px; }
  .ctl-label { width: 100%; }
  .tabs { flex-wrap: wrap; overflow: visible; }
  .menu { right: auto; left: 0; }
  .tabs button { padding: 8px 10px 7px; }
}
.nota-bloco { color: var(--ink-2); font-size: 12.5px; margin: 0; }
/* --- preços: praças escolhidas (até 4) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 4px 4px 10px; font-size: 13px; max-width: 100%; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { font: inherit; border: 0; background: transparent; color: var(--ink-3); width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.chip button:hover { background: var(--brand-soft); color: var(--ink); }
.chip button svg { width: 14px; height: 14px; }
.add { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.add select { max-width: 100%; }
.dica { color: var(--ink-3); font-size: 12.5px; }
.key.dot { border-top-style: dotted; border-top-width: 3px; }
.bar-sel { font-weight: 700; }
@media (max-width: 560px) { .add select { width: 100%; } }
</style>
</head>

  function avisarAltura() { try { parent.postMessage({ bigdata: D.id, altura: document.documentElement.scrollHeight }, "*"); } catch (e) {} }
  let rt, larg = $("painel").clientWidth;
  new ResizeObserver(() => { const w = $("painel").clientWidth; if (w === larg) return; larg = w; clearTimeout(rt); rt = setTimeout(() => { graficos.forEach(g => g.desenhar()); avisarAltura(); }, 80); }).observe($("painel"));
  montarAbas();
  montarPainel();
})();
</script>
